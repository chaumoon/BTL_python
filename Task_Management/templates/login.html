<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Page</title>
    <style>
        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #6BCFD7;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #6BCFD7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #FFC1CC;
        }
        .forgot-link {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        #customAlert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 4px;
            color: white;
            display: none;
            z-index: 1000;
            min-width: 250px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .alert-danger {
            background-color: #854540;
        }
        .alert-success {
            background-color: #24d32a;
        }
        .close-btn {
            margin-left: 15px;
            color: white;
            font-weight: bold;
            float: right;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div id="customAlert">
        <span id="alertMessage"></span>
        <span class="close-btn" onclick="hideAlert()">&times;</span>
    </div>
    <div class="container">
        <h1>Sign In</h1>
        <form id="signin-form" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <a class="forgot-link" onclick="window.location.href='/forgot'">Forgot Password</a>
    </div>
    {% if error %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            showAlert("{{ error|escapejs }}", true);
        });
    </script>
    {% endif %}

    <script>
        function showAlert(message, isError = false) {
            const alertDiv = document.getElementById('customAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            alertDiv.style.display = 'block';
            alertDiv.className = `alert alert-dismissible fade show ${isError ? 'alert-danger' : 'alert-success'}`;
            alertMessage.textContent = message;
            
            setTimeout(hideAlert, 5000);
        }

        function hideAlert() {
            const alertDiv = document.getElementById('customAlert');
            alertDiv.style.display = 'none';
        }
    </script>
</body>
</html>
