<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password Page</title>
    <style>
        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #6BCFD7;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #6BCFD7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #FFC1CC;
        }
        .notice {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }
        .message {
            color: rgb(52, 195, 104);
            text-align: center;
            margin-bottom: 15px;
        }
        .links {
            margin-top: 30px;
        }
        a {
            margin: 0 10px;
            text-decoration: none;
            color: #3366cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <form id="signup-form" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit">Reset password</button>
        </form>
        <div class="links">
            <a onclick="window.location.href='/login'">Login</a> |
            <a onclick="window.location.href='/register'">Sign Up</a>
          </div>
    </div>
    {% if notice %}
    <script>
        alert("{{ notice|escapejs }}");
    </script>
    {% endif %}
    {% if message %}
    <script>
        alert("{{ message|escapejs }}");
    </script>
    {% endif %}
</body>
</html>
